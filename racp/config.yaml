  bm25: ~
  contriever: ~

# ------------------------------------------------Environment Settings------------------------------------------------#
# Directory paths for data and outputs
data_dir: "/home/guanjunjie/my_datasets/FlashRAG_datasets/"
save_dir: "racp/output/"

gpu_id: "0,1,2,3"
dataset_name: "hotpotqa" # name of the dataset in data_dir
split: [ "dev" ]  # dataset split to load (e.g. train,dev,test)

# Sampling configurations for testing
test_sample_num: ~  # number of samples to test (only work in dev/test split), if None, test all samples
random_sample: False # whether to randomly sample the test samples

# Seed for reproducibility
seed: 2024

# Whether save intermediate data
save_intermediate_data: True
save_note: 'experiment'

# -------------------------------------------------Retrieval Settings------------------------------------------------#
# If set the name, the model path will be find in global paths
retrieval_method: "bge-large-en-v1.5"  # name or path of the retrieval model. 
index_path: ~ # set automatically if not provided. 
faiss_gpu: False # whether use gpu to hold index
corpus_path: "/home/guanjunjie/my_datasets/FlashRAG_datasets/retrieval-corpus/wiki18_100w.jsonl"  # path to corpus in '.jsonl' format that store the documents

instruction: ~ # instruction for retrieval model
retrieval_topk: 20 # number of retrieved documents
retrieval_batch_size: 1024  # batch size for retrieval
retrieval_use_fp16: True  # whether to use fp16 for retrieval model
retrieval_query_max_length: 128  # max length of the query
save_retrieval_cache: False # whether to save the retrieval cache
use_retrieval_cache: False # whether to use the retrieval cache
retrieval_cache_path: ~ # path to the retrieval cache
retrieval_pooling_method: ~ # set automatically if not provided

use_reranker: True # whether to use reranker
rerank_model_name: bge-reranker-large # same as retrieval_method
rerank_model_path: /home/guanjunjie/my_models/bge-reranker-large # path to reranker model, path will be automatically find in `retriever_model2path`
rerank_pooling_method: ~
rerank_topk: 20  # number of remain documents after reranking
rerank_max_length: 256
rerank_batch_size: 4 # batch size for reranker
rerank_use_fp16: True

# -------------------------------------------------Generator Settings------------------------------------------------#
framework: vllm # inference frame work of LLM, supporting: 'hf','vllm','fschat'
generator_model: "Llama-3.1-8B-Instruct" # name or path of the generator model
generator_max_input_len: 4096  # max length of the input, matching benchmark_result.xlsx
generator_batch_size: 2 # batch size for generation, invalid for vllm
gpu_memory_utilization: 0.75 # leave room for reranker on 24GB GPUs
generation_params:
  do_sample: False
  max_tokens: 32
use_fid: False # whether to use FID, only valid in encoder-decoder model


# -------------------------------------------------Refiner Settings------------------------------------------------#
# If set, the refiner will be used to refine the retrieval documents.
refiner_name: null
refiner_model_path: "/home/guanjunjie/my_models/gpt2"

# Used for extractive method (e.g embedding models)
refiner_topk: 5 # number of remain sentence after refiner
refiner_pooling_method: 'mean' # pooling method of refiner model
refiner_encode_max_length: 256
# Used for abstractive method (e.g. generation models like bart-large-cnn)
refiner_max_input_length: 1024
refiner_max_output_length: 512

# Specify settings for llmlingua
llmlingua_config:
  rate: 0.55
  condition_in_question: 'after_condition'
  reorder_context: 'sort'
  dynamic_context_compression_ratio: 0.3
  condition_compare: True
  context_budget: "+100"
  rank_method: 'longllmlingua'
sc_config:
  'reduce_ratio': 0.5
racp_config:
  buffer: 5
  max_k: 8
  search_ratio: 0.9

# run_racp.py defaults to EFC-RAG. CLI values override this reference block.
efc_rag_config:
  enabled: False
  force_route: auto
  initial_topk: 20
  probe_topk: 5
  final_topk: 6
  enable_static_qd_fallback: True
  qd_num: 2
  qd_topk: 5
  enable_generation_guided: True
  gen_topk: 10
  missing_query_num: 1
  missing_query_mode: llm
  rrf_k: 60
  rrf_weight: 1.0
  role_weight: 0.30
  title_weight: 0.02
  source_weight: 0.05
  redundancy_weight: 0.01
  title_dedup_soft: True
  max_same_title: 2
  original_seed_count: 4
  rrf_only_selection: False
  static_bridge_evidence_topk: 5
  static_bridge_original_count: 4
  static_bridge_qd_count: 2
  use_centroid_router: False
  save_efc_debug: False
  probe_max_tokens: 128
  planner_inference_batch_size: 8

# -------------------------------------------------Evaluation Settings------------------------------------------------#
# Metrics to evaluate the result
metrics: [ 'em','f1','acc','precision','recall','retrieval_recall']
# Specify setting for metric, will be called within certain metrics
metric_setting:
  retrieval_recall_topk: 10
save_metric_score: True #　whether to save the metric score into txt file
